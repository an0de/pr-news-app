<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Django News{% endblock %}</title>
</head>
<body>
<div id="content">
    {% block content %}{% endblock %}
</div>
</body>
<style>
:root {
  margin: 0;
  padding: 0;
  border: 0;
  width: 100vw;
  color: #111;
  font-family: sans-serif;
}
a {
  color: inherit;
  font-variant: small-caps;
  font-weight: 400;
}
#content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-around;
}
.news-list {
  max-width: 600px;
}
</style>
</html>
