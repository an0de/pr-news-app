{% extends "base.html" %}

{% block content %}
<h1>News</h1>
<form action="" method="get">
    <!-- {% csrf_token %} -->
       {{ form }}
    <!-- <input type="submit" value="Find"> -->
</form>
{% for article in articles %}
{% if article.is_published %}
<div class="news-list">
  <div class="news-title"><h2><a href="/articles/{{article.id}}">{{ article.title }}</a></h2></div>
  <div class="news-content"><p>{{ article.content }}</p></div>
</div>
{% endif %}
{% endfor %}
{% endblock %}
