{% extends "base.html" %}

{% block content %}
<div class="news">
  <div class="news-title"><h1>{{ article.title }}</h1></div>
  <div class="news-content"><p>{{ article.content }}</p></div>
  <div class="news-info"><p>Published by {{ article.author.username }}, {{ article.created_at }}</p></div>
</div>
{% endblock %}
